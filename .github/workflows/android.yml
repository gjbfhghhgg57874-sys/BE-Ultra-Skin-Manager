name: Build BE Ultra Skin Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BE_Ultra_Skin_Manager_Starter.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o BE_Ultra_Skin_Manager_Starter.zip -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/android_app
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BE-Ultra-Skin-Manager-APK
          path: project/android_app/app/build/outputs/apk/debug/app-debug.apk
